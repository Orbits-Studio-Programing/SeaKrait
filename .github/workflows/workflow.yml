name: Publish Package to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and Publish Python Package
    runs-on: ubuntu-latest
    
    # Restricts execution to your specific PyPI environment
    environment:
      name: pypi
      url: https://pypi.org # Optional: Links the run directly to PyPI

    # REQUIRED PERMISSIONS FOR OIDC + PEP 740 ATTESTATIONS
    permissions:
      id-token: write      # Mandatory for OIDC token minting
      attestations: write  # Allows the action to sign and upload your build proof
      contents: read       # Allows checking out code

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build

    - name: Build source tarball and binary wheel
      run: python -m build

    - name: Publish to PyPI via OIDC
      uses: pypa/gh-action-pypi-publish@release/v1
