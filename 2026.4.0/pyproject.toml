[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SeaKrait"
version = "2026.3.5"
authors = [
    { name="Matthew Carter", email="mjcarter002@gmail.com" },
]
description = "This is a quick and easy to use Library for python that adds a bunch of random functions."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"


keywords = ["sea", "snake", "seakrait", "krait"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    ]

dependencies = [
    "requests>=2.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]